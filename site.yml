---
# Main playbook for Arch Linux setup
- name: Configure Arch Linux workstation
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - default.config.yml
    - config.yml
  vars_prompt:
    - name: ssh_pass
      prompt: SSH key passphrase (leave empty for no passphrase)
      private: true
      confirm: false
      
  tasks:
    # System update
    - name: Update package cache
      import_tasks: tasks/update.yml
      when: update | default(true)
    
    # Core system setup
    - name: Install base system packages
      import_tasks: tasks/base.yml
    - name: Install modern CLI utilities
      import_tasks: tasks/utilities.yml
    
    # System services
    - name: Enable multilib repository
      import_tasks: tasks/multilib.yml
    - name: Add Chaotic-AUR repository
      import_tasks: tasks/chaotic-aur.yml
    - name: Setup audio system
      import_tasks: tasks/audio.yml
    - name: Setup hardware support
      import_tasks: tasks/hardware.yml
    
    # Display and desktop
    - name: Setup display system
      import_tasks: tasks/display.yml
    - name: Setup desktop environment
      import_tasks: tasks/desktop.yml
      when: enable_desktop | default(true)
    
    # Applications
    - name: Install development tools
      import_tasks: tasks/development.yml
      when: enable_development | default(true)
    - name: Install desktop applications
      import_tasks: tasks/applications.yml
      when: enable_desktop | default(true)
    - name: Install fonts
      import_tasks: tasks/fonts.yml
    
    # System configuration
    - name: Configure swap file
      import_tasks: tasks/swap.yml
    - name: Configure system services
      import_tasks: tasks/other-services.yml
    
    # User configuration
    - name: Configure zsh shell
      import_tasks: tasks/zsh.yml
    - name: Setup zsh catppuccin theme
      import_tasks: tasks/zsh-catppuccin.yml
    - name: Generate SSH key
      import_tasks: tasks/genssh.yml
      when: generate_ssh_key | default(true)
    - name: Configure git
      import_tasks: tasks/git-config.yml
    
    # Display manager
    - name: Setup GDM display manager
      import_tasks: tasks/gdm.yml
      when: enable_gdm | default(true)
    
    # Dotfiles and final setup
    - name: Install dotfiles
      import_tasks: tasks/install-dotfiles.yml
    - name: Setup development environment
      import_tasks: tasks/dev-setup.yml
      when: enable_development | default(true)
    
    # Final upgrade
    - name: Upgrade all packages
      import_tasks: tasks/upgrade.yml