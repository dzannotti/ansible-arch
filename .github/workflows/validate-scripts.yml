name: Validate Bash Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: ShellCheck Analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run ShellCheck on setup.sh
        run: shellcheck --rcfile=.shellcheckrc setup.sh
        
      - name: Run ShellCheck on scripts directory
        run: |
          if [ -d scripts ] && [ "$(ls -A scripts)" ]; then
            find scripts -name "*.sh" -type f | while read -r script; do
              echo "Checking $script"
              shellcheck --rcfile=.shellcheckrc "$script"
            done
          else
            echo "No scripts found to check"
          fi

  syntax-check:
    runs-on: ubuntu-latest
    name: Bash Syntax Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check setup.sh syntax
        run: bash -n setup.sh
        
      - name: Check all scripts syntax
        run: |
          if [ -d scripts ] && [ "$(ls -A scripts)" ]; then
            find scripts -name "*.sh" -type f | while read -r script; do
              echo "Checking syntax: $script"
              bash -n "$script"
            done
          else
            echo "No scripts found to check syntax"
          fi
          
      - name: Verify scripts are executable
        run: |
          if [ -d scripts ] && [ "$(ls -A scripts)" ]; then
            find scripts -name "*.sh" -type f | while read -r script; do
              if [ ! -x "$script" ]; then
                echo "ERROR: $script is not executable"
                exit 1
              fi
            done
            echo "All scripts are executable"
          else
            echo "No scripts found to check permissions"
          fi