name: Validate Bash Scripts

on:
  push:
    branches: [ main, sept25-updates ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: ShellCheck
    steps:
      - uses: actions/checkout@v4
      
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          format: gcc
          severity: warning
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2034
          
      - name: Check main setup.sh
        run: shellcheck setup.sh

  syntax-check:
    runs-on: ubuntu-latest
    name: Bash Syntax Check
    steps:
      - uses: actions/checkout@v4
      
      - name: Check setup.sh syntax
        run: bash -n setup.sh
        
      - name: Check all scripts syntax
        run: |
          if [ -d scripts ]; then
            for script in scripts/*.sh; do
              if [ -f "$script" ]; then
                echo "Checking syntax: $script"
                bash -n "$script"
              fi
            done
          fi