---
# Display system - Wayland with XWayland compatibility
- name: Install XWayland compatibility layer
  become: true
  community.general.pacman:
    name:
      - xorg-xwayland  # X11 app compatibility on Wayland
    state: present
  changed_when: false

- name: Install Wayland base packages
  become: true
  community.general.pacman:
    name:
      - wayland
      - wayland-protocols
      - qt5-wayland
      - qt6-wayland
      - wl-clipboard
      - wtype
      - slurp
    state: present
  changed_when: false