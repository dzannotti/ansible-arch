---
# Audio system (PipeWire)
- name: Install PipeWire audio system
  become: true
  community.general.pacman:
    name:
      - pipewire
      - pipewire-alsa
      - pipewire-pulse
      - pipewire-jack
      - wireplumber
      - alsa-utils
      - pavucontrol
      - gst-plugin-pipewire  # GStreamer PipeWire plugin for media apps
      - pipewire-v4l2        # Camera/video support
    state: present
  changed_when: false

- name: Enable PipeWire services
  become: false
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    scope: user
  loop:
    - pipewire
    - pipewire-pulse
    - wireplumber
  changed_when: false