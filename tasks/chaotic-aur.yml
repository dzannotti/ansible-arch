---
- name: Import primary key
  become: true
  command: pacman-key --recv-key 3056513887B78AEB  --keyserver keyserver.ubuntu.com
  changed_when: false

- name: Sign primary key
  become: true
  command: pacman-key --lsign-key 3056513887B78AEB
  changed_when: false

- name: Install keyring and mirrorlist
  become: true
  command: pacman -U 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst' --noconfirm
  changed_when: false

- name: Check pacman.conf contents
  command: cat /etc/pacman.conf
  register: pacman_conf_output
  changed_when: false

- name: Add repository to pacman.conf
  become: true
  lineinfile:
    path: /etc/pacman.conf
    line: |
      [chaotic-aur]
      Include = /etc/pacman.d/chaotic-mirrorlist
    insertafter: EOF
  when: "'[chaotic-aur]' not in pacman_conf_output.stdout"
  changed_when: false
  failed_when: false

- name: Update package cache after adding repository
  import_tasks: tasks/update.yml

- name: Install yay (temporary bootstrap for paru)
  become: true
  community.general.pacman:
    name: yay
    state: present

- name: Clone paru from AUR
  become: false
  git:
    repo: https://aur.archlinux.org/paru.git
    dest: /tmp/paru
    force: true

- name: Build and install paru
  become: false
  command: makepkg -si --noconfirm
  args:
    chdir: /tmp/paru
  changed_when: true

- name: Remove yay after paru installation
  become: true
  community.general.pacman:
    name: yay
    state: absent

- name: Clean up paru build directory
  become: false
  file:
    path: /tmp/paru
    state: absent
