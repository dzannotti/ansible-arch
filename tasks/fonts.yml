---
# Font installation
- name: Install essential system fonts from pacman
  become: true
  community.general.pacman:
    name:
      # Essential GNOME fonts
      - noto-fonts          # Universal fonts
      - noto-fonts-cjk      # Asian language support
      - noto-fonts-emoji    # Emoji support
      - ttf-liberation      # Microsoft font replacements
    state: present
  changed_when: false

- name: Install programming and custom fonts from AUR
  become: false
  kewlfft.aur.aur:
    name:
      # Programming fonts (Nerd Font variants preferred)
      - ttf-cascadia-code-nerd    # Your main coding font
      - ttf-firacode-nerd         # Fira Code with icons
      - ttf-geist                 # Geist family (if available)
      - ttf-geist-mono            # Geist Mono (if available)
      # System compatibility fonts
      - ttf-ms-fonts              # Windows fonts (Arial, Times New Roman, etc.)
      # System font
      - otf-san-francisco         # SF Pro for system UI
    use: yay
    state: present
  changed_when: false