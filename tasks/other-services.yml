---
# Essential system services
- name: Enable NetworkManager
  become: true
  systemd:
    name: NetworkManager
    enabled: true
    state: started
  changed_when: false

- name: Enable network discovery (Avahi)
  become: true
  systemd:
    name: avahi-daemon
    enabled: true
    state: started
  changed_when: false

- name: Enable GNOME Keyring
  become: false
  systemd:
    name: gnome-keyring-daemon
    enabled: true
    scope: user
  changed_when: false

- name: Enable power profiles daemon
  become: true
  systemd:
    name: power-profiles-daemon
    enabled: true
    state: started
  changed_when: false

- name: Enable SSH daemon
  become: true
  systemd:
    name: sshd
    enabled: true
  when: enable_ssh | default(false)
  changed_when: false

- name: Enable firewall
  become: true
  systemd:
    name: ufw
    enabled: true
  when: enable_firewall | default(true)
  changed_when: false
