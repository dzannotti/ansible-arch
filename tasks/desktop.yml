---
# Desktop environment - GNOME on Wayland
- name: Install GNOME desktop components
  become: true
  community.general.pacman:
    name:
      # Core GNOME
      - libnotify
      - gnome-keyring
      - gnome-control-center
      - gnome-tweaks
      - gnome-shell
      - gnome-shell-extensions
      - gnome-themes-extra
      - extension-manager     # GUI for managing GNOME extensions
      # File manager and utilities
      - nautilus
      - file-roller       # Archive manager
      - evince            # PDF viewer
      - gnome-calculator
      - gnome-text-editor
      - gnome-disk-utility
      # GTK theming
      - gtk3
      - gtk4
      - libadwaita
      # Qt support for Qt apps
      - qt6-svg
      - qt6-virtualkeyboard  
      - qt6-multimedia-ffmpeg
    state: present
  changed_when: false

- name: Install AUR desktop packages
  become: true
  kewlfft.aur.aur:
    name:
      - gnome-shell-extension-dash-to-dock
      - extension-manager           # GNOME extensions GUI manager
    use: paru
    state: present
  changed_when: false