---
# Desktop environment - Hyprland and components
- name: Install Hyprland and core components
  become: true
  community.general.pacman:
    name:
      # Hyprland
      - hyprland
      - hyprpaper
      - hyprlock
      - hyprpicker
      - xdg-desktop-portal-hyprland
      # Window management
      - swaybg
      - swayimg
      - swaylock
      - swaync
      # Desktop components
      - waybar
      - wofi
      - libnotify
      - polkit-gnome
      # File manager
      - nautilus
      # Theming
      - lxappearance
      - gtk4
      - libadwaita
      # Qt support
      - layer-shell-qt5
      - qt6-svg
      - qt6-virtualkeyboard
      - qt6-multimedia-ffmpeg
    state: present
  changed_when: false

- name: Install AUR desktop packages
  become: true
  kewlfft.aur.aur:
    name:
      - hyprshot
      - bibata-cursor-theme-bin
    use: yay
    state: present
  changed_when: false