---
# Desktop environment - GNOME on Wayland
- name: Install GNOME desktop components
  become: true
  community.general.pacman:
    name:
      # Core GNOME
      - libnotify
      - gnome-keyring
      - gnome-control-center
      - gnome-tweaks
      - gnome-shell
      - gnome-shell-extensions
      - gnome-themes-extra
      # File manager and utilities
      - nautilus
      - file-roller       # Archive manager
      - evince            # PDF viewer
      - gnome-calculator
      - gnome-text-editor
      - gnome-disk-utility
      # GTK theming
      - gtk3
      - gtk4
      - libadwaita
      - gtk-engine-murrine  # Required for GTK themes
      - sassc               # Required for theme compilation
      # Qt support for Qt apps
      - qt6-svg
      - qt6-virtualkeyboard  
      - qt6-multimedia-ffmpeg
    state: present
  changed_when: false
