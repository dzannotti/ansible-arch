---
# Limine bootloader configuration with Tokyo Night theme
- name: Install Limine and related packages
  become: true
  community.general.pacman:
    name:
      - limine
      - plymouth           # Boot splash screen
    state: present
  changed_when: false

- name: Configure mkinitcpio hooks for Plymouth
  become: true
  copy:
    dest: /etc/mkinitcpio.conf.d/plymouth_hooks.conf
    content: |
      # Add Plymouth for smooth boot splash
      HOOKS=(base udev plymouth autodetect microcode modconf kms keymap consolefont block filesystems fsck)
    mode: '0644'
  notify: rebuild initramfs

- name: Check if Limine config exists (EFI)
  stat:
    path: /boot/EFI/limine/limine.conf
  register: limine_efi_config

- name: Check if Limine config exists (BIOS)
  stat:
    path: /boot/limine/limine.conf
  register: limine_bios_config

- name: Set Limine config path
  set_fact:
    limine_config_path: "{{ '/boot/EFI/limine/limine.conf' if limine_efi_config.stat.exists else '/boot/limine/limine.conf' }}"

- name: Configure Limine with Tokyo Night theme
  become: true
  copy:
    dest: "{{ limine_config_path }}"
    content: |
      ### Limine bootloader configuration with Tokyo Night theme
      timeout: 3
      default_entry: 0
      interface_branding: Arch Linux
      interface_branding_color: 2
      hash_mismatch_panic: no

      # Tokyo Night color scheme
      term_background: 1a1b26
      backdrop: 1a1b26

      # Terminal colors (Tokyo Night palette)
      term_palette: 15161e;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;a9b1d6
      term_palette_bright: 414868;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;c0caf5

      # Text colors
      term_foreground: c0caf5
      term_foreground_bright: c0caf5
      term_background_bright: 24283b

      # Kernel entries will be automatically added by limine-update
    mode: '0644'
  when: limine_efi_config.stat.exists or limine_bios_config.stat.exists

- name: Update kernel command line for quiet boot
  become: true
  lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.systemd.show_status=false rd.udev.log_level=3 vt.global_cursor_default=0"'
    create: true
  when: ansible_facts['os_family'] == "Archlinux"
  notify: 
    - update grub
    - rebuild initramfs