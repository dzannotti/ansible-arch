---
# Install yay AUR helper from precompiled binary (no Go dependency needed)
- name: Download yay precompiled binary
  become: false
  get_url:
    url: https://github.com/Jguer/yay/releases/download/v12.5.0/yay_12.5.0_x86_64.tar.gz
    dest: /tmp/yay_12.5.0_x86_64.tar.gz
    mode: '0644'
  changed_when: true

- name: Extract yay binary
  become: false
  unarchive:
    src: /tmp/yay_12.5.0_x86_64.tar.gz
    dest: /tmp/
    remote_src: true
    creates: /tmp/yay_12.5.0_x86_64/yay
  changed_when: true

- name: Install yay binary to /usr/local/bin
  become: true
  copy:
    src: /tmp/yay_12.5.0_x86_64/yay
    dest: /usr/local/bin/yay
    mode: '0755'
    remote_src: true
  args:
    creates: /usr/local/bin/yay

- name: Clean up yay download files
  become: false
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/yay_12.5.0_x86_64.tar.gz
    - /tmp/yay_12.5.0_x86_64