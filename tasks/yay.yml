---
# Simple, secure AUR helper installation
- name: Clone yay from AUR
  become: false
  git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
    version: master
    force: true
  changed_when: true
  
- name: Build and install yay
  become: false
  shell: |
    cd /tmp/yay
    makepkg -si --noconfirm --needed
  args:
    creates: /usr/bin/yay
  
- name: Clean up yay build directory
  become: false
  file:
    path: /tmp/yay
    state: absent