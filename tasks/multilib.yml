- name: Ensure [multilib] repo is enabled
  become: true
  lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*\[multilib\]'
    line: '[multilib]'
    state: present

- name: Ensure multilib mirrorlist is included
  become: true
  lineinfile:
    path: /etc/pacman.conf
    insertafter: '^\[multilib\]'
    regexp: '^#?\s*Include\s*=\s*/etc/pacman.d/mirrorlist'
    line: 'Include = /etc/pacman.d/mirrorlist'
    state: present

- name: Update pacman cache
  become: true
  pacman:
    update_cache: true

- name: Install essential 32-bit libraries for gaming/Steam
  become: true
  community.general.pacman:
    name:
      - lib32-mesa          # 32-bit graphics
      - lib32-alsa-plugins  # 32-bit audio
      - lib32-gtk3          # 32-bit GUI toolkit
      - lib32-glibc         # 32-bit C library
    state: present
  changed_when: false
