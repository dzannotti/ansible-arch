---
# Desktop applications - browsers, media, productivity
- name: Install desktop applications from pacman
  become: true
  community.general.pacman:
    name:
      # Media
      - vlc
      - ffmpeg
      # Productivity
      - libreoffice-fresh
      # Launcher and utilities
      - rofi                # Application launcher
      - copyq               # Clipboard manager
      # Media and productivity
      - obsidian            # Note-taking
      - flameshot           # Screenshot annotation
      - qbittorrent         # Torrent client
      # Download tools
      - yt-dlp              # YouTube downloader
      - aria2               # Multi-protocol downloader
    state: present
  changed_when: false

- name: Install password management from official repos
  become: true  
  community.general.pacman:
    name:
      - bitwarden          # Password manager
    state: present
  changed_when: false

- name: Install desktop applications from AUR
  become: false
  kewlfft.aur.aur:
    name:
      # Browser
      - brave-bin
      # Media and entertainment
      - spotify
      # Download tools
      - gallery-dl
      # Communication
      - ferdium
      - zoom
    use: yay
    state: present
  changed_when: false