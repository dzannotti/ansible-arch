---
# Desktop applications - browsers, media, productivity
- name: Install desktop applications from pacman
  become: true
  community.general.pacman:
    name:
      # Media
      - vlc
      - ffmpeg
      # Productivity
      - libreoffice-fresh
      # Launcher and utilities
      - rofi                # Application launcher
      - copyq               # Clipboard manager
    state: present
  changed_when: false

- name: Install desktop applications from AUR
  become: true
  kewlfft.aur.aur:
    name:
      # Browser
      - brave-bin
      # Password management
      - bitwarden
      # Media and entertainment
      - spotify
      # Download tools
      - yt-dlp
      - gallery-dl
      - aria2
      # Communication
      - ferdium
      - zoom
      # Productivity
      - obsidian
      # Screenshot annotation
      - flameshot
      # Torrents
      - qbittorrent
    use: paru
    state: present
  changed_when: false