---
# Core system packages - the absolute essentials
- name: Install base system packages
  become: true
  community.general.pacman:
    name:
      # Core system
      - base
      - base-devel
      - linux
      - linux-firmware
      - linux-headers
      - sudo
      - man-db
      - man-pages
      # Networking
      - dhcpcd
      - networkmanager
      - openssh
      # Basic tools
      - nano
      - git
      - wget
      - reflector
    state: present
  changed_when: false