---
# Core system packages - the absolute essentials
- name: Install base system packages
  become: true
  community.general.pacman:
    name:
      # Core system
      - base
      - base-devel
      - linux
      - linux-firmware
      - linux-headers
      - sudo
      - man-db
      - man-pages
      # Networking
      - networkmanager
      - openssh
      # Basic tools
      - git
      - curl
      - micro
      - vim
      - which
      - less
      - tree
      - bind-tools  # dig, nslookup for network debugging
      # Shell
      - zsh
      - bash-completion
      # Build tools (needed for AUR)
      - rust
      - cargo
      # System utilities
      - bc
      - stow
      - btop
      - fastfetch
      - man-db
      - inetutils
      - whois
      - plocate
      - tldr
      - ufw
      # Filesystem support
      - dosfstools
      - ntfs-3g
      - exfatprogs
      - gvfs              # Virtual filesystem (MTP, SMB support)
      - gvfs-mtp          # Phone/device support
      - gvfs-smb          # Network share support
      - power-profiles-daemon  # Power management
      # Compression
      - p7zip
      - unzip
    state: present
  changed_when: false