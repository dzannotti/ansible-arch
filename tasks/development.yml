---
# Development tools and environments
- name: Install development languages and runtimes
  become: true
  community.general.pacman:
    name:
      - python            # System Python (Arch default)
      - python-pip
      # Compilers and build tools
      - clang
      - llvm
      - gcc
      # Development tools
      - tmux              # Terminal multiplexer
      - jq                # JSON processor
      - universal-ctags   # Code navigation
      - shellcheck        # Shell script linting
      - openssh           # SSH client/server
      - gnupg             # GPG encryption
      - imagemagick       # Image manipulation
      # Modern CLI alternatives
      - eza               # Better ls
      - bat               # Better cat
      - fd                # Better find
      - fzf               # Fuzzy finder
      - ripgrep           # Better grep
      # Version management
      - mise              # Universal runtime manager
      # Git and development tools
      - git-delta         # Beautiful git diffs
      - lazygit           # TUI git interface
      - github-cli        # GitHub CLI
      - starship          # Modern shell prompt
      - zoxide            # Smarter cd command
    state: present
  changed_when: false

- name: Install terminal from official repos
  become: true
  community.general.pacman:
    name:
      - ghostty           # Modern terminal emulator
    state: present
  changed_when: false

- name: Install development tools from AUR
  become: true
  kewlfft.aur.aur:
    name:
      # Editors and IDEs
      - neovim-git
      - visual-studio-code-bin
      # API/Development tools
      - postman-bin       # API testing
    use: paru
    state: present
  changed_when: false

- name: Install runtime languages via mise
  become: false
  shell: |
    # Install latest versions as global defaults
    mise install node@latest
    mise install go@latest
    mise global node@latest go@latest
    # Install JS package managers
    mise exec -- npm install -g pnpm bun
  args:
    creates: ~/.local/share/mise/installs/node
  changed_when: true