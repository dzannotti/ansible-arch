---
# Hardware support - CPU, GPU, monitoring tools
- name: Install AMD microcode
  become: true
  community.general.pacman:
    name:
      - amd-ucode
    state: present
  changed_when: false

- name: Install hardware monitoring tools
  become: true
  community.general.pacman:
    name:
      - acpi
      - btop
      - cpupower
      - turbostat
      - lm_sensors
    state: present
  changed_when: false

- name: Install NVIDIA drivers
  become: true
  community.general.pacman:
    name:
      - nvidia
      - nvidia-utils
      - nvidia-settings
      - lib32-nvidia-utils
    state: present
  when: enable_nvidia | default(false)
  changed_when: false

- name: Configure NVIDIA DRM kernel mode setting for Wayland
  become: true
  copy:
    dest: /etc/modprobe.d/nvidia.conf
    content: |
      options nvidia_drm modeset=1
      options nvidia_drm fbdev=1
      options nvidia NVreg_PreserveVideoMemoryAllocations=1
      options nvidia NVreg_TemporaryFilePath=/var/tmp
    mode: '0644'
  when: enable_nvidia | default(false)

- name: Enable NVIDIA power management services
  become: true
  systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - nvidia-suspend
    - nvidia-hibernate
    - nvidia-resume
  when: enable_nvidia | default(false)

- name: Install Bluetooth support
  become: true
  community.general.pacman:
    name:
      - bluez
      - bluez-utils
      - bluez-plugins
      - blueman
    state: present
  when: enable_bluetooth | default(false)
  changed_when: false

- name: Enable Bluetooth service
  become: true
  systemd:
    name: bluetooth
    enabled: true
    state: started
  when: enable_bluetooth | default(false)