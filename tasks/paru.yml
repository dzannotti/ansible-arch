---
# Simple, secure AUR helper installation
- name: Clone paru from AUR
  become: false
  git:
    repo: https://aur.archlinux.org/paru.git
    dest: /tmp/paru
    version: master
    force: true
  changed_when: true
  
- name: Build and install paru
  become: false
  shell: |
    cd /tmp/paru
    makepkg -si --noconfirm --needed
  args:
    creates: /usr/bin/paru
  
- name: Clean up paru build directory
  become: false
  file:
    path: /tmp/paru
    state: absent