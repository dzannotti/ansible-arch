---
# Gaming platform and optimization tools
- name: Install gaming platform and tools
  become: true
  community.general.pacman:
    name:
      - steam              # Gaming platform (multilib)
      - gamemode           # System optimization for gaming
      - mangohud           # Gaming performance overlay
    state: present
  changed_when: false

- name: Enable gamemode for current user
  become: true
  user:
    name: "{{ ansible_user_id }}"
    groups: gamemode
    append: true