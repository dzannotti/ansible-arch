---
# Gaming platform and optimization tools
- name: Install gaming platform
  become: true
  community.general.pacman:
    name:
      - steam              # Gaming platform
      - gamemode           # System optimization for gaming
    state: present
  changed_when: false

- name: Install gaming tools from AUR
  become: true
  kewlfft.aur.aur:
    name:
      - mangohud           # Gaming performance overlay
    use: paru
    state: present
  changed_when: false

- name: Enable gamemode for current user
  become: true
  user:
    name: "{{ ansible_user_id }}"
    groups: gamemode
    append: true