[defaults]
# Inventory file location
inventory = inventories/production/hosts.yml
# Use the default callback plugin with YAML output format
stdout_callback = ansible.builtin.default
callback_result_format = yaml
# Disable SSH host key checking for localhost
host_key_checking = False
# Increase the number of parallel processes
forks = 20
# Set the default roles path
roles_path = ./roles
# Python interpreter discovery
interpreter_python = auto_silent
# Fact caching to speed up playbook runs
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 86400
# Retry files
retry_files_enabled = False
# Disable cowsay
nocows = True
# Set the vault password file (optional, uncomment if using vault)
# vault_password_file = ~/.vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = True

[ssh_connection]
# Speed up connections
pipelining = True
control_path = /tmp/ansible-%%h-%%p-%%r